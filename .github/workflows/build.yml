name: Build and Test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: xcode-27
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode Project
        run: xcodegen generate

      - name: Build App for iOS (Unsigned)
        run: |
          xcodebuild build \
            -project Study.xcodeproj \
            -scheme Study \
            -destination "generic/platform=iOS" \
            -configuration Release \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            BUILD_DIR=build

      - name: Run Unit Tests
        run: |
          xcodebuild test \
            -project Study.xcodeproj \
            -scheme Study \
            -destination "platform=iOS Simulator,name=iPhone 17" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Package Unsigned IPA
        run: |
          mkdir -p Payload
          APP_PATH=$(find build -name "Study.app" -type d | head -n 1)
          echo "Packaging application found at: $APP_PATH"
          cp -R "$APP_PATH" Payload/
          zip -r Study-unsigned-ipa.ipa Payload
          mkdir -p artifacts
          mv Study-unsigned-ipa.ipa artifacts/

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Study-unsigned-ipa
          path: artifacts/Study-unsigned-ipa.ipa
