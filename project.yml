name: Study
options:
  bundleIdPrefix: com.andyml
  xcodeVersion: "27.0"

settings:
  base:
    SWIFT_VERSION: "6.0"
    IPHONEOS_DEPLOYMENT_TARGET: "27.0"
    TARGETED_DEVICE_FAMILY: "1" # iPhone only
    CODE_SIGNING_ALLOWED: NO
    CODE_SIGNING_REQUIRED: NO
    CODE_SIGN_IDENTITY: ""

targets:
  Study:
    type: application
    platform: iOS
    deploymentTarget: "27.0"
    sources:
      - Study
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.andyml.study
        INFOPLIST_FILE: Study/Info.plist
    dependencies:
      - target: StudyWidgets
        embed: true

  StudyWidgets:
    type: app-extension
    platform: iOS
    deploymentTarget: "27.0"
    sources:
      - StudyWidgets
      - Study/Core/Models/FocusActivityAttributes.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.andyml.study.widgets
        INFOPLIST_FILE: StudyWidgets/Info.plist

  StudyTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "27.0"
    sources:
      - StudyTests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.andyml.study.tests
        INFOPLIST_FILE: StudyTests/Info.plist
    dependencies:
      - target: Study
